# testbot: a small biped for testing the platform in simulation. It is not
# a model of any real robot. testbot.xml repeats the joint limits and the
# default pose, and must stay equal to this file.
schema_version: 1
name: testbot
status: active
base_link: pelvis

# Canonical joint order: arrays of joint values follow this list.
# Every joint is a hinge about y; positive swings the segment below it back.
joints:
  - name: left_hip_pitch
    motor_index: 0
    default_position: -0.3
    limits: {position: [-1.5, 0.5], velocity: 20.0, effort: 60.0}
    gains: {kp: 60.0, kd: 2.0}
  - name: left_knee
    motor_index: 1
    default_position: 0.6
    limits: {position: [0.0, 2.2], velocity: 20.0, effort: 80.0}
    gains: {kp: 80.0, kd: 2.0}
  - name: left_ankle_pitch
    motor_index: 2
    default_position: -0.3
    limits: {position: [-0.8, 0.6], velocity: 20.0, effort: 30.0}
    gains: {kp: 40.0, kd: 2.0}
  - name: right_hip_pitch
    motor_index: 3
    default_position: -0.3
    limits: {position: [-1.5, 0.5], velocity: 20.0, effort: 60.0}
    gains: {kp: 60.0, kd: 2.0}
  - name: right_knee
    motor_index: 4
    default_position: 0.6
    limits: {position: [0.0, 2.2], velocity: 20.0, effort: 80.0}
    gains: {kp: 80.0, kd: 2.0}
  - name: right_ankle_pitch
    motor_index: 5
    default_position: -0.3
    limits: {position: [-0.8, 0.6], velocity: 20.0, effort: 30.0}
    gains: {kp: 40.0, kd: 2.0}

joint_groups:
  legs: [left_hip_pitch, left_knee, left_ankle_pitch,
         right_hip_pitch, right_knee, right_ankle_pitch]
  left_leg: [left_hip_pitch, left_knee, left_ankle_pitch]
  right_leg: [right_hip_pitch, right_knee, right_ankle_pitch]

imu:
  frame: imu_link
  parent: pelvis
  mount_xyz: [-0.02, 0.0, 0.04]   # m, in the pelvis frame

rates:
  physics_hz: 500.0
  control_hz_max: 500.0

models:                           # relative to this file
  mjcf: testbot.xml
